<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="assets/ds/styles.css">

<body>

<div class="mk-page">

  <div class="mk-header__sticky">
    <header class="mk-header">
      <a href="index.html" class="mk-wordmark mk-wordmark--sm">
        <span>Maxime Kreiter.</span>
        <span class="mk-wordmark__sub">Architecte</span>
      </a>
      <nav class="mk-header__nav">
        <a href="projets.html" class="mk-navlink" aria-current="page" data-i18n="projets">Projets</a>
        <button type="button" class="mk-langbtn" data-lang-toggle aria-label="Switch to English">EN</button>
      </nav>
    </header>
  </div>

  <main class="mk-main">

    <!-- Le titre n'est plus affiché, mais la page doit garder un titre de
         niveau 1 pour les moteurs de recherche et les lecteurs d'écran. -->
    <h1 class="mk-sr-only" data-i18n="projets">Projets</h1>

    <section class="mk-index__body">

      <div class="mk-index__controls">
        <div class="mk-filters" id="mk-filters"></div>
        <label class="mk-switch">
          <input type="checkbox" class="mk-switch__input" id="mk-view">
          <span class="mk-switch__track" aria-hidden="true"><span class="mk-switch__knob"></span></span>
          <!-- Libellé piloté par le JavaScript : il annonce la vue vers
               laquelle on bascule. Sans JS, on est en grille et le texte
               statique ci-dessous est le bon. -->
          <span id="mk-view-label">Vue liste</span>
        </label>
      </div>

      <div id="mk-list" hidden>
        <div class="mk-list__head">
          <span class="mk-meta">Réf.</span>
          <span class="mk-meta" data-i18n="projet">Projet</span>
          <span class="mk-meta" data-i18n="lieu">Lieu</span>
          <span class="mk-meta" data-i18n="annee">Année</span>
        </div>
        <div class="mk-list__rows" id="mk-rows"></div>
      </div>

      <div class="mk-grid" id="mk-grid"></div>

      <!-- Aperçu affiché au centre de l'écran au survol d'une ligne, en vue
           liste. Rempli par le JavaScript ; sans lui, il reste vide. -->
      <div class="mk-preview" id="mk-preview" aria-hidden="true"><img alt=""></div>

      <p class="mk-meta mk-empty" id="mk-empty" hidden></p>

    </section>

  </main>

  <footer class="mk-footer">
    <div class="mk-footer__cols">
      <div class="mk-footer__col">
        <span class="mk-footer__title" data-i18n="atelier">Atelier</span>
        <span class="mk-footer__line">59 rue Montesquieu, 69007 Lyon</span>
      </div>
      <div class="mk-footer__col">
        <span class="mk-footer__title">Contact</span>
        <span class="mk-footer__line"><a href="mailto:contact@maximekreiter.fr">contact@maximekreiter.fr</a> · <a href="tel:+33631070905">06 31 07 09 05</a></span>
      </div>
      <div class="mk-footer__col">
        <span class="mk-footer__title" data-i18n="suivre">Suivre</span>
        <span class="mk-footer__line">Instagram</span>
      </div>

    <span class="mk-footer__note">© 2026 Maxime Kreiter Architecte</span>
