<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnostic — accroche de la page de garde</title>

<!-- Les deux feuilles de style du site, dans l'ordre exact de index.html :
     cette page mesure donc le texte dans ses conditions réelles. -->
<link rel="stylesheet" href="assets/ds/styles.css">
<link rel="stylesheet" href="assets/css/site.css">

<style>
  .diag {
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    padding: 16px;
    border-top: 1px solid #0003;
    white-space: pre-wrap;
  }
  .diag b { font-weight: 700; }
  .diag .ok  { color: #15803D; font-weight: 700; }
  .diag .ko  { color: #B91C1C; font-weight: 700; }
  .diag h2 { font: 700 15px/1.4 ui-monospace, Menlo, monospace; margin: 18px 0 6px; }
  /* Repère visuel : le bord droit du bloc de texte. */
  .mk-garde__lede { outline: 1px dashed #B91C1C55; }
</style>
</head>
<body>

<div class="mk-page">
  <main class="mk-garde">
    <div class="mk-garde__body">
      <h1 class="mk-garde__name">
        <span class="mk-garde__name-a">Maxime Kreiter.</span>
        <span class="mk-garde__name-b">Architecte</span>
      </h1>
      <p class="mk-garde__lede" id="lede">Une architecture sobre et réversible, pensée pour durer et changer d’usage.
Transformer l’existant, réemployer, privilégier les ressources du territoire.
Pour des maîtres d’ouvrage publics, privés ou associatifs.</p>
    </div>
  </main>
</div>

<div class="diag" id="sortie">Mesure en cours…</div>

<script>
(function () {
  var sortie = document.getElementById('sortie');

  function lignesRendues(el) {
    var r = document.createRange();
    r.selectNodeContents(el);
    var tops = [];
    var rects = r.getClientRects();
    for (var i = 0; i < rects.length; i++) {
      if (rects[i].width > 0) {
        var t = Math.round(rects[i].top);
        if (tops.indexOf(t) === -1) tops.push(t);
      }
    }
    return tops.length;
  }

  function largeurNaturelle(texte, lede) {
    var cs = getComputedStyle(lede);
    var s = document.createElement('span');
    s.textContent = texte;
    s.style.position = 'absolute';
    s.style.left = '-9999px';
    s.style.top = '0';
    s.style.whiteSpace = 'nowrap';
    s.style.font = cs.font && cs.font !== '' ? cs.font : '';
    s.style.fontFamily = cs.fontFamily;
    s.style.fontSize = cs.fontSize;
    s.style.fontWeight = cs.fontWeight;
    s.style.fontStyle = cs.fontStyle;
    s.style.letterSpacing = cs.letterSpacing;
    s.style.wordSpacing = cs.wordSpacing;
    s.style.textTransform = cs.textTransform;
    document.body.appendChild(s);
    var w = s.getBoundingClientRect().width;
    document.body.removeChild(s);
    return w;
  }

  function mesurer() {
    var lede = document.getElementById('lede');
    var cs = getComputedStyle(lede);
    var boite = lede.getBoundingClientRect().width;
    var version = getComputedStyle(document.documentElement)
                    .getPropertyValue('--mk-version').trim() || '(absente)';

    var phrases = lede.textContent.split('\n');
    var out = [];

    out.push('<h2>1. La bonne feuille de style est-elle chargée ?</h2>');
    out.push('marqueur --mk-version : <b>' + version + '</b>');
    out.push(version.indexOf('2026-10-02') !== -1
      ? '<span class="ok">OK — c\'est bien le site.css le plus récent.</span>'
      : '<span class="ko">NON — le navigateur utilise un ancien site.css. Tout ce qui suit est donc à relire après mise à jour.</span>');

    out.push('<h2>2. La fenêtre et la police</h2>');
    out.push('largeur de la fenêtre   : ' + window.innerWidth + ' px');
    out.push('densité d\'écran         : ' + (window.devicePixelRatio || 1) + '×');
    // document.fonts.check() répond « oui » même quand la police n'a pas été
    // téléchargée du tout. On compare donc deux largeurs : si « Fustat,
    // monospace » et « monospace » donnent le même résultat, Fustat n'est pas
    // utilisée et c'est la substitution qui s'affiche.
    function largeurAvec(familles) {
      var s = document.createElement('span');
      s.textContent = 'Transformer l’existant, réemployer';
      s.style.cssText = 'position:absolute;left:-9999px;top:0;white-space:nowrap;'
                      + 'font-size:48px;font-family:' + familles;
      document.body.appendChild(s);
      var w = s.getBoundingClientRect().width;
      document.body.removeChild(s);
      return w;
    }
    var avec = largeurAvec('Fustat, monospace');
    var sans = largeurAvec('monospace');
    out.push('Fustat réellement active: ' + (Math.abs(avec - sans) > 1
      ? 'OUI' : 'NON — c\'est une police de substitution qui s\'affiche'));
    out.push('taille de police        : ' + cs.fontSize);
    out.push('familles demandées      : ' + cs.fontFamily);

    out.push('<h2>3. Les règles appliquées au bloc de texte</h2>');
    out.push('width       : ' + cs.width);
    out.push('max-width   : ' + cs.maxWidth);
    out.push('min-width   : ' + cs.minWidth);
    out.push('white-space : ' + cs.whiteSpace);
    out.push('text-wrap   : ' + (cs.textWrap || cs.textWrapStyle || '(non exposé)'));
    out.push('hyphens     : ' + (cs.hyphens || cs.webkitHyphens || '(non exposé)'));

    out.push('<h2>4. Chaque phrase tient-elle dans la place disponible ?</h2>');
    out.push('largeur du bloc : <b>' + Math.round(boite) + ' px</b>');
    for (var i = 0; i < phrases.length; i++) {
      var p = phrases[i].trim();
      if (!p) continue;
      var w = largeurNaturelle(p, lede);
      var tient = w <= boite + 0.5;
      out.push('phrase ' + (i + 1) + ' : ' + Math.round(w) + ' px — '
        + (tient ? '<span class="ok">tient (' + Math.round(boite - w) + ' px de marge)</span>'
                 : '<span class="ko">TROP LARGE de ' + Math.round(w - boite) + ' px</span>'));
    }

    out.push('<h2>5. Verdict</h2>');
    var n = lignesRendues(lede);
    out.push('lignes réellement affichées : <b>' + n + '</b> (attendu : 3)');
    var toutTient = true;
    for (var j = 0; j < phrases.length; j++) {
      var q = phrases[j].trim();
      if (q && largeurNaturelle(q, lede) > boite + 0.5) toutTient = false;
    }
    if (n === 3) {
      out.push('<span class="ok">Rien à corriger ici : les trois phrases sont entières.</span>');
    } else if (!toutTient) {
      out.push('<span class="ko">Cause : la place manque vraiment. Il faut réduire la taille du texte, élargir le bloc, ou raccourcir les phrases.</span>');
    } else {
      out.push('<span class="ko">Cause : la place est suffisante et le navigateur coupe quand même. C\'est son algorithme de césure qui est en jeu, pas la largeur.</span>');
    }

    sortie.innerHTML = out.join('\n');
  }

  // On attend que les polices soient réellement chargées : mesurer avant
  // donnerait les chiffres de la police de substitution.
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { setTimeout(mesurer, 120); });
  } else {
    window.addEventListener('load', function () { setTimeout(mesurer, 400); });
  }
  window.addEventListener('resize', function () { setTimeout(mesurer, 120); });
})();
</script>

</body>
</html>
